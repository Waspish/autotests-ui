# Имя вашего workflow, которое будет отображаться в интерфейсе GitHub Actions
name: UI tests

# Указываем, когда будет запускаться данный workflow
on:
  push:
    branches:
      - main  # Запускать workflow, когда будет сделан коммит в ветку main
  pull_request:
    branches:
      - main  # Запускать workflow, когда будет сделан pull request в ветку main

# Определяем все шаги, которые должны быть выполнены в рамках работы с тестами
jobs:
  run-tests:
    runs-on: ubuntu-latest  # Указываем, что тесты будут запускаться на последней версии Ubuntu

    steps:
      # Клонирование вашего репозитория на машину GitHub Actions
      - name: Check out repository
        uses: actions/checkout@v7 # Используем GitHub Action для клонирования репозитория

      # Установка Python на виртуальной машине
      - name: Set up Python
        uses: actions/setup-python@v7  # Используем GitHub Action для установки Python
        with:
          python-version: '3.13'  # Устанавливаем версию Python 3.11 (можно заменить на другую версию)

      # Установка всех зависимостей проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  # Обновляем pip до последней версии
          pip install -r requirements.txt  # Устанавливаем зависимости, указанные в requirements.txt
          playwright install --with-deps  # Устанавливаем браузеры для Playwright (если они не установлены)

      # Запуск тестов с использованием pytest и генерации отчётов Allure
      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2  # Запускаем тесты, отмеченные как "regression", генерируем результаты для Allure

      # Восстанавливаем историю покрытия из кеша
      - name: Restore coverage-history.json from cache
        if: always()
        uses: actions/cache/restore@v6
        with:
          path: coverage-history.json
          key: coverage-history-{{ github.run_id }}
          restore-keys: |
            coverage-history-

      # Генерируем HTML-отчет и обновляем историю
      - name: Generate UI coverage report
        if: always()
        run: |
          ui-coverage-tool save-report

      # Сохраняем историю обратно в кеш
      - name: Save coverage-history.json in cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: coverage-history.json
          key: coverage-history-${{ github.run_id }}

      # Загружаем HTML-отчет как артефакт
      - name: Saving coverage.html as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage.html

      # Шаг для сохранения отчётов Allure как артефакта
      - name: Saving allure-results folder as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-artifact
          path: allure-results

  publish-report:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      # Шаг для сохранения отчётов Allure как артефакта
      - name: Downloading allure-results-artifact
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: allure-results-artifact
          path: allure-results-new

      # Шаг для получения истории отчётов Allure, если она существует
      - name: Get Allure history
        if: always()  # Всегда выполняем, независимо от успеха или неудачи предыдущих шагов
        uses: actions/checkout@v7  # Опять клонируем репозиторий, чтобы получить историю отчётов
        continue-on-error: true  # Если здесь возникнет ошибка, workflow всё равно продолжит выполнение
        with:
          ref: gh-pages  # Указываем ветку gh-pages для получения отчётов
          path: gh-pages  # Указываем путь для сохранения отчётов

      # Шаг для генерации и отображения отчёта Allure
      - name: Generates Allure Report with history
        if: always()  # Этот шаг тоже всегда выполняется
        uses: simple-elf/allure-report-action@master  # Используем готовое решение из GitHub Marketplace для генерации Allure отчёта
        with:
          allure_results: allure-results-new  # Указываем каталог с результатами тестов
          allure_history: allure-history-hello  # Указываем каталог для истории отчётов Allure

      # Шаг для деплоя отчёта Allure на GitHub Pages, чтобы его можно было просматривать в браузере
      - name: Deploy report to Github Pages
        if: always()  # Выполняется всегда, независимо от успеха других шагов
        uses: peaceiris/actions-gh-pages@v4  # Используем GitHub Action для публикации отчёта на GitHub Pages
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Токен для аутентификации на GitHub
          publish_branch: gh-pages  # Указываем, что отчёт будет опубликован в ветке gh-pages
          publish_dir: allure-history-hello  # Указываем папку, которая будет опубликована на GitHub Pages